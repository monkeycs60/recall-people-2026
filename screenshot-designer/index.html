<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Designer — Recall People</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0D0D0D;
      --surface: #161616;
      --surface-hover: #1E1E1E;
      --border: #2A2A2A;
      --accent: #8B5CF6;
      --accent-hover: #7C3AED;
      --text: #E5E5E5;
      --text-muted: #888;
      --radius: 10px;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    /* --- Drop Zone --- */
    #dropZone {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 32px;
    }
    #dropZone.active { display: flex; }

    .drop-brand {
      text-align: center;
    }
    .drop-brand h1 {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #A78BFA, #8B5CF6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .drop-brand p {
      color: var(--text-muted);
      margin-top: 6px;
      font-size: 15px;
    }

    .drop-area {
      width: 520px;
      height: 260px;
      border: 2px dashed #333;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: all 0.2s;
      cursor: pointer;
      background: var(--surface);
    }
    .drop-area:hover, .drop-area.dragover {
      border-color: var(--accent);
      background: rgba(139, 92, 246, 0.05);
    }
    .drop-area .icon { font-size: 48px; opacity: 0.5; }
    .drop-area .label { font-size: 16px; color: var(--text-muted); }
    .drop-area .hint { font-size: 13px; color: #555; }
    .drop-area .btn-browse {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 28px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .drop-area .btn-browse:hover { background: var(--accent-hover); }

    /* --- Editor Layout --- */
    #editor {
      display: none;
      grid-template-columns: 180px 1fr 320px;
      height: 100vh;
    }
    #editor.active { display: grid; }

    /* --- Sidebar --- */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-header h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    .thumb-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .thumb-item {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
      background: #111;
    }
    .thumb-item:hover { border-color: #444; }
    .thumb-item.active { border-color: var(--accent); }
    .thumb-item img {
      width: 100%;
      display: block;
      aspect-ratio: 1284 / 2778;
      object-fit: cover;
    }
    .thumb-item .badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 11px;
      font-weight: 600;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* --- Preview --- */
    .preview-area {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #111;
      overflow: hidden;
    }
    #previewCanvas {
      height: calc(100vh - 40px);
      max-width: 100%;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 0 60px rgba(0,0,0,0.4);
    }

    /* --- Controls --- */
    .controls {
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .controls-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .controls-header h2 {
      font-size: 16px;
      font-weight: 600;
    }
    .btn-reset {
      background: none;
      border: 1px solid #333;
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-reset:hover { border-color: #555; color: var(--text); }

    .control-group { display: flex; flex-direction: column; gap: 8px; }
    .control-group label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
    }

    .control-group textarea,
    .control-group input[type="text"] {
      background: #111;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      resize: none;
      outline: none;
      transition: border-color 0.15s;
    }
    .control-group textarea:focus,
    .control-group input[type="text"]:focus {
      border-color: var(--accent);
    }
    .control-group textarea { min-height: 72px; line-height: 1.5; }

    /* Gradient grid */
    .gradient-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .grad-swatch {
      aspect-ratio: 1;
      border-radius: 10px;
      cursor: pointer;
      border: 2.5px solid transparent;
      transition: all 0.15s;
      position: relative;
    }
    .grad-swatch:hover { transform: scale(1.08); }
    .grad-swatch.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    }
    .grad-swatch .swatch-name {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: white;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
    }
    .grad-swatch:hover .swatch-name { display: block; }

    /* Text color */
    .color-row {
      display: flex;
      gap: 10px;
    }
    .color-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
      border: 2.5px solid transparent;
      transition: all 0.15s;
    }
    .color-btn:hover { transform: scale(1.08); }
    .color-btn.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    }
    .color-btn.white-btn {
      background: #FFFFFF;
    }
    .color-btn.dark-btn {
      background: #1E1B4B;
      box-shadow: inset 0 0 0 1px #444;
    }

    /* Range sliders */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #222;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--bg);
    }
    .range-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .range-row input[type="range"] { flex: 1; }
    .range-value {
      font-size: 13px;
      color: var(--text-muted);
      min-width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Action buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-secondary:hover { background: var(--surface-hover); border-color: #444; }

    /* Progress overlay */
    #exportProgress {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
    }
    #exportProgress.active { display: flex; }
    .progress-text { font-size: 18px; font-weight: 500; }
    .progress-bar-bg {
      width: 300px;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Drop Zone -->
  <div id="dropZone" class="active">
    <div class="drop-brand">
      <h1>Screenshot Designer</h1>
      <p>Recall People — App Store Marketing Visuals</p>
    </div>
    <div class="drop-area" id="dropArea">
      <div class="icon">&#128247;</div>
      <div class="label">Drop your App Store screenshots here</div>
      <div class="hint">PNG files from screenshots/appstore/</div>
      <button class="btn-browse" onclick="document.getElementById('fileInput').click()">Choose Files</button>
    </div>
    <input type="file" id="fileInput" multiple accept="image/png,image/jpeg" hidden>
  </div>

  <!-- Editor -->
  <div id="editor">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Screens</h2>
      </div>
      <div class="thumb-list" id="thumbList"></div>
    </div>

    <div class="preview-area">
      <canvas id="previewCanvas" width="1284" height="2778"></canvas>
    </div>

    <div class="controls">
      <div class="controls-header">
        <h2>Edit</h2>
        <button class="btn-reset" onclick="resetCurrent()">Reset</button>
      </div>

      <div class="control-group">
        <label>Headline</label>
        <textarea id="headlineInput" rows="3" placeholder="Main headline text..."></textarea>
      </div>

      <div class="control-group">
        <label>Subtitle</label>
        <input type="text" id="subtitleInput" placeholder="Short subtitle...">
      </div>

      <div class="control-group">
        <label>Background</label>
        <div class="gradient-grid" id="gradientGrid"></div>
      </div>

      <div class="control-group">
        <label>Text Color</label>
        <div class="color-row">
          <div class="color-btn white-btn" id="colorWhite" onclick="setTextColor('#FFFFFF')"></div>
          <div class="color-btn dark-btn" id="colorDark" onclick="setTextColor('#1E1B4B')"></div>
        </div>
      </div>

      <div class="control-group">
        <label>Headline Size</label>
        <div class="range-row">
          <input type="range" id="headlineSizeSlider" min="56" max="120" value="86">
          <span class="range-value" id="headlineSizeValue">86</span>
        </div>
      </div>

      <div class="control-group">
        <label>Phone Position</label>
        <div class="range-row">
          <input type="range" id="phoneYSlider" min="650" max="1050" value="830">
          <span class="range-value" id="phoneYValue">830</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary" onclick="exportCurrent()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export Current
        </button>
        <button class="btn-secondary" onclick="exportAll()">Export All (PNG)</button>
      </div>
    </div>
  </div>

  <!-- Export progress -->
  <div id="exportProgress">
    <div class="progress-text" id="progressText">Exporting...</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
    </div>
  </div>
</div>

<script>
// ─── Constants ──────────────────────────────────────────────
const CW = 1284, CH = 2778;
const PHONE_W = 870, PHONE_H = 1780, PHONE_R = 58;
const PHONE_X = (CW - PHONE_W) / 2;
const BZ = 14; // Uniform thin bezel (iPhone)
const SCR_R = 46;
// Dynamic Island
const DI_W = 130, DI_H = 40, DI_R = 20;

const GRADIENTS = [
  { name: 'Violet Cloud',  css: 'linear-gradient(135deg, #EDE9FE, #F8F7F4, #DDD6FE)' },
  { name: 'Deep Lavender', css: 'linear-gradient(135deg, #DDD6FE, #C4B5FD, #EDE9FE)' },
  { name: 'Soft Mist',     css: 'linear-gradient(135deg, #F5F3FF, #FAFAFA, #EDE9FE)' },
  { name: 'Warm Touch',    css: 'linear-gradient(135deg, #FEF3C7, #EDE9FE, #F8F7F4)' },
  { name: 'Pure Cream',    css: 'linear-gradient(135deg, #F8F7F4, #FAFAFA, #F5F0FF)' },
];

const PRESETS = [
  { match: '1',  headline: 'All your contacts\nat a glance',            subtitle: 'Smart contact management powered by AI',     gradient: 0, textColor: '#1E1B4B', headlineSize: 86, phoneY: 830 },
  { match: '2',  headline: 'Record a voice note\nafter each meeting',   subtitle: 'Just talk \u2014 AI does the rest',           gradient: 0, textColor: '#1E1B4B', headlineSize: 82, phoneY: 830 },
  { match: '3',  headline: 'AI creates a rich profile\nfor each contact', subtitle: 'Key facts, always up to date',             gradient: 0, textColor: '#1E1B4B', headlineSize: 78, phoneY: 830 },
  { match: '4',  headline: 'Never miss\nan important event',            subtitle: 'Your personal event timeline',               gradient: 0, textColor: '#1E1B4B', headlineSize: 88, phoneY: 830 },
  { match: '5',  headline: 'Ask anything\nabout your contacts',         subtitle: 'AI searches through all your notes',         gradient: 0, textColor: '#1E1B4B', headlineSize: 88, phoneY: 830 },
  { match: '6',  headline: 'Your AI-powered\nassistant',                subtitle: 'Search across your entire network',          gradient: 0, textColor: '#1E1B4B', headlineSize: 88, phoneY: 830 },
  { match: '7',  headline: 'Smart extraction\nfrom your voice notes',   subtitle: 'Phone, groups, events \u2014 auto-detected', gradient: 0, textColor: '#1E1B4B', headlineSize: 82, phoneY: 830 },
  { match: '8',  headline: 'AI-powered\nconversation starters',         subtitle: 'Never run out of things to say',             gradient: 0, textColor: '#1E1B4B', headlineSize: 86, phoneY: 830 },
  { match: '9',  headline: 'Available in\n5 languages',                 subtitle: 'English, French, Spanish, Italian, German',  gradient: 0, textColor: '#1E1B4B', headlineSize: 88, phoneY: 830 },
  { match: '10', headline: 'Turn your voice into\nsmart contact cards', subtitle: 'The easiest way to remember people',         gradient: 0, textColor: '#1E1B4B', headlineSize: 82, phoneY: 830 },
];

// ─── State ──────────────────────────────────────────────────
let screenshots = [];
let currentIdx = 0;

// ─── DOM refs ───────────────────────────────────────────────
const canvas = document.getElementById('previewCanvas');
const ctx = canvas.getContext('2d');
const dropZone = document.getElementById('dropZone');
const dropArea = document.getElementById('dropArea');
const editor = document.getElementById('editor');
const thumbList = document.getElementById('thumbList');
const headlineInput = document.getElementById('headlineInput');
const subtitleInput = document.getElementById('subtitleInput');
const gradientGrid = document.getElementById('gradientGrid');
const headlineSizeSlider = document.getElementById('headlineSizeSlider');
const headlineSizeValue = document.getElementById('headlineSizeValue');
const phoneYSlider = document.getElementById('phoneYSlider');
const phoneYValue = document.getElementById('phoneYValue');
const fileInput = document.getElementById('fileInput');
const exportProgressEl = document.getElementById('exportProgress');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');

// ─── Helpers ────────────────────────────────────────────────
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function extractNumber(filename) {
  const m = filename.match(/(\d+)/);
  return m ? m[1] : null;
}

function findPreset(filename) {
  const num = extractNumber(filename);
  if (!num) return null;
  return PRESETS.find(p => p.match === num) || null;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ─── Floating Orbs Background System ────────────────────────
// Orbs exist in a virtual 5-screen-wide strip for seamless continuity.
// x: absolute pixel position across the strip, y: pixel position vertically.
const STRIP_SCREENS = 5;
const STRIP_W = STRIP_SCREENS * CW;

const GLOBAL_ORBS = [
  // ── Large orbs (r: 400-550) — dominant shapes ──
  { x: -100,  y: 350,  r: 500, color: '#C4B5FD', op: 0.28 },
  { x: 1150,  y: 1400, r: 480, color: '#8B5CF6', op: 0.12 },
  { x: 2100,  y: 400,  r: 520, color: '#DDD6FE', op: 0.22 },
  { x: 3200,  y: 1800, r: 460, color: '#A78BFA', op: 0.15 },
  { x: 4400,  y: 500,  r: 500, color: '#C4B5FD', op: 0.25 },
  { x: 5500,  y: 1200, r: 440, color: '#8B5CF6', op: 0.13 },
  { x: 6350,  y: 600,  r: 480, color: '#DDD6FE', op: 0.20 },

  // ── Medium orbs (r: 250-380) ──
  { x: 600,   y: 2100, r: 320, color: '#A78BFA', op: 0.16 },
  { x: 1700,  y: 700,  r: 350, color: '#EDE9FE', op: 0.30 },
  { x: 2800,  y: 2200, r: 300, color: '#DDD6FE', op: 0.18 },
  { x: 3800,  y: 600,  r: 280, color: '#C4B5FD', op: 0.22 },
  { x: 4800,  y: 2000, r: 340, color: '#A78BFA', op: 0.14 },
  { x: 5800,  y: 2400, r: 310, color: '#EDE9FE', op: 0.20 },

  // ── Warm accent orbs (peach/amber — sparse) ──
  { x: 400,   y: 1100, r: 220, color: '#FDE68A', op: 0.14 },
  { x: 2400,  y: 2400, r: 200, color: '#FBBF24', op: 0.08 },
  { x: 4000,  y: 1200, r: 180, color: '#FDE68A', op: 0.10 },
  { x: 5900,  y: 1800, r: 240, color: '#FBBF24', op: 0.07 },

  // ── Small texture orbs (r: 80-170) ──
  { x: 200,   y: 1600, r: 140, color: '#8B5CF6', op: 0.18 },
  { x: 900,   y: 500,  r: 120, color: '#A78BFA', op: 0.22 },
  { x: 1500,  y: 2300, r: 100, color: '#C4B5FD', op: 0.25 },
  { x: 2200,  y: 1300, r: 130, color: '#DDD6FE', op: 0.20 },
  { x: 3000,  y: 700,  r: 110, color: '#A78BFA', op: 0.15 },
  { x: 3500,  y: 2500, r: 150, color: '#8B5CF6', op: 0.12 },
  { x: 4200,  y: 1600, r: 90,  color: '#EDE9FE', op: 0.30 },
  { x: 5000,  y: 400,  r: 130, color: '#C4B5FD', op: 0.20 },
  { x: 5600,  y: 1000, r: 120, color: '#DDD6FE', op: 0.18 },
  { x: 6300,  y: 2100, r: 170, color: '#A78BFA', op: 0.14 },
];

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function drawOrb(c, x, y, radius, color, opacity) {
  const grd = c.createRadialGradient(x, y, 0, x, y, radius);
  grd.addColorStop(0, hexToRgba(color, opacity));
  grd.addColorStop(0.45, hexToRgba(color, opacity * 0.6));
  grd.addColorStop(0.75, hexToRgba(color, opacity * 0.2));
  grd.addColorStop(1, hexToRgba(color, 0));
  c.fillStyle = grd;
  c.beginPath();
  c.arc(x, y, radius, 0, Math.PI * 2);
  c.fill();
}

function drawBackground(c, gradientIdx, screenIndex) {
  const idx = screenIndex || 0;
  const viewLeft = idx * CW;

  // 1. Cream base
  c.fillStyle = '#F8F7F4';
  c.fillRect(0, 0, CW, CH);

  // 2. Subtle violet atmospheric wash (position shifts per screen)
  const washCX = CW * 0.35 - idx * 90;
  const washCY = CH * 0.30;
  const washR = CH * 0.55;
  const washGrd = c.createRadialGradient(washCX, washCY, 0, washCX, washCY, washR);
  washGrd.addColorStop(0, 'rgba(237, 233, 254, 0.50)');
  washGrd.addColorStop(0.4, 'rgba(237, 233, 254, 0.20)');
  washGrd.addColorStop(1, 'rgba(237, 233, 254, 0)');
  c.fillStyle = washGrd;
  c.fillRect(0, 0, CW, CH);

  // 3. Second warm wash bottom-right (subtle peach tint, like landing page)
  const warmCX = CW * 0.8 + idx * 60;
  const warmCY = CH * 0.75;
  const warmR = CH * 0.4;
  const warmGrd = c.createRadialGradient(warmCX, warmCY, 0, warmCX, warmCY, warmR);
  warmGrd.addColorStop(0, 'rgba(253, 230, 138, 0.12)');
  warmGrd.addColorStop(0.5, 'rgba(253, 230, 138, 0.04)');
  warmGrd.addColorStop(1, 'rgba(253, 230, 138, 0)');
  c.fillStyle = warmGrd;
  c.fillRect(0, 0, CW, CH);

  // 4. Render global orbs visible in this viewport
  GLOBAL_ORBS.forEach(orb => {
    const localX = orb.x - viewLeft;
    // Only draw if orb circle intersects this screen
    if (localX + orb.r > -50 && localX - orb.r < CW + 50) {
      drawOrb(c, localX, orb.y, orb.r, orb.color, orb.op);
    }
  });
}

// ─── Rendering ──────────────────────────────────────────────
function render(targetCanvas, data, screenIndex) {
  const c = targetCanvas.getContext('2d');
  const { image, headline, subtitle, gradient, textColor, headlineSize, phoneY } = data;

  c.clearRect(0, 0, CW, CH);

  // 1. Background with organic shapes (screenIndex for wave continuity)
  drawBackground(c, gradient, screenIndex || 0);

  // 2. Text
  const hlLines = headline.split('\n');
  const hlLineH = headlineSize * 1.18;
  const hlBlockH = hlLines.length * hlLineH;
  const subSize = 42;
  const gap = 30;
  const totalTextH = hlBlockH + gap + subSize;
  const textMidY = phoneY / 2;
  const textStartY = textMidY - totalTextH / 2;

  c.textAlign = 'center';
  c.textBaseline = 'middle';

  // Headline
  c.font = `800 ${headlineSize}px "Plus Jakarta Sans", sans-serif`;
  c.fillStyle = textColor;
  hlLines.forEach((line, i) => {
    c.fillText(line, CW / 2, textStartY + (i + 0.5) * hlLineH);
  });

  // Subtitle
  c.font = `500 ${subSize}px "Plus Jakarta Sans", sans-serif`;
  c.fillStyle = textColor === '#FFFFFF' ? 'rgba(255,255,255,0.7)' : 'rgba(109, 40, 217, 0.55)';
  c.fillText(subtitle, CW / 2, textStartY + hlBlockH + gap + subSize / 2);

  // ── iPhone Mockup ──

  // Side buttons (before phone body so they appear behind)
  c.fillStyle = '#2C2C2E';
  // Power button (right side)
  roundRect(c, PHONE_X + PHONE_W - 1, phoneY + PHONE_H * 0.28, 4, 110, 2);
  c.fill();
  // Volume up (left side)
  roundRect(c, PHONE_X - 3, phoneY + PHONE_H * 0.22, 4, 55, 2);
  c.fill();
  // Volume down (left side)
  roundRect(c, PHONE_X - 3, phoneY + PHONE_H * 0.22 + 70, 4, 55, 2);
  c.fill();
  // Action button (left, above volume)
  roundRect(c, PHONE_X - 3, phoneY + PHONE_H * 0.22 - 55, 4, 38, 2);
  c.fill();

  // 3. Phone shadow
  c.save();
  c.shadowColor = 'rgba(30, 27, 75, 0.18)';
  c.shadowBlur = 60;
  c.shadowOffsetX = 0;
  c.shadowOffsetY = 20;
  roundRect(c, PHONE_X, phoneY, PHONE_W, PHONE_H, PHONE_R);
  c.fillStyle = '#1C1C1E';
  c.fill();
  c.restore();

  // 4. Titanium frame (metallic gradient stroke)
  roundRect(c, PHONE_X, phoneY, PHONE_W, PHONE_H, PHONE_R);
  const frameGrad = c.createLinearGradient(PHONE_X, phoneY, PHONE_X + PHONE_W, phoneY + PHONE_H);
  frameGrad.addColorStop(0, 'rgba(255,255,255,0.22)');
  frameGrad.addColorStop(0.25, 'rgba(255,255,255,0.08)');
  frameGrad.addColorStop(0.5, 'rgba(255,255,255,0.04)');
  frameGrad.addColorStop(0.75, 'rgba(255,255,255,0.10)');
  frameGrad.addColorStop(1, 'rgba(255,255,255,0.18)');
  c.strokeStyle = frameGrad;
  c.lineWidth = 3.5;
  c.stroke();

  // Inner edge (gap between frame and screen)
  const scrX = PHONE_X + BZ;
  const scrY = phoneY + BZ;
  const scrW = PHONE_W - BZ * 2;
  const scrH = PHONE_H - BZ * 2;

  roundRect(c, scrX - 0.5, scrY - 0.5, scrW + 1, scrH + 1, SCR_R + 0.5);
  c.strokeStyle = 'rgba(0,0,0,0.6)';
  c.lineWidth = 1;
  c.stroke();

  // 5. Screen content
  c.save();
  roundRect(c, scrX, scrY, scrW, scrH, SCR_R);
  c.clip();
  c.imageSmoothingEnabled = true;
  c.imageSmoothingQuality = 'high';
  if (image) {
    c.drawImage(image, scrX, scrY, scrW, scrH);
  } else {
    c.fillStyle = '#000';
    c.fillRect(scrX, scrY, scrW, scrH);
  }
  c.restore();

  // Dynamic Island removed — it overlaps app UI on some screens
}

function updatePreview() {
  if (screenshots.length === 0) return;
  const s = screenshots[currentIdx];
  render(canvas, s, currentIdx);
}

// ─── UI ─────────────────────────────────────────────────────
function buildGradientSwatches() {
  gradientGrid.innerHTML = '';
  GRADIENTS.forEach((g, i) => {
    const el = document.createElement('div');
    el.className = 'grad-swatch';
    el.style.background = g.css;
    el.innerHTML = `<span class="swatch-name">${g.name}</span>`;
    el.onclick = () => {
      screenshots[currentIdx].gradient = i;
      syncControlsFromState();
      updatePreview();
    };
    gradientGrid.appendChild(el);
  });
}

function buildThumbnails() {
  thumbList.innerHTML = '';
  screenshots.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'thumb-item' + (i === currentIdx ? ' active' : '');
    el.innerHTML = `
      <img src="${s.imageSrc}" alt="Screen ${i + 1}">
      <div class="badge">${i + 1}</div>
    `;
    el.onclick = () => selectScreen(i);
    thumbList.appendChild(el);
  });
}

function selectScreen(idx) {
  saveCurrentToState();
  currentIdx = idx;
  loadStateToControls();
  updateThumbnailHighlight();
  updatePreview();
}

function updateThumbnailHighlight() {
  thumbList.querySelectorAll('.thumb-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentIdx);
  });
}

function saveCurrentToState() {
  if (screenshots.length === 0) return;
  const s = screenshots[currentIdx];
  s.headline = headlineInput.value;
  s.subtitle = subtitleInput.value;
  s.headlineSize = parseInt(headlineSizeSlider.value);
  s.phoneY = parseInt(phoneYSlider.value);
}

function loadStateToControls() {
  const s = screenshots[currentIdx];
  headlineInput.value = s.headline;
  subtitleInput.value = s.subtitle;
  headlineSizeSlider.value = s.headlineSize;
  headlineSizeValue.textContent = s.headlineSize;
  phoneYSlider.value = s.phoneY;
  phoneYValue.textContent = s.phoneY;
  syncControlsFromState();
}

function syncControlsFromState() {
  const s = screenshots[currentIdx];
  // Gradient
  gradientGrid.querySelectorAll('.grad-swatch').forEach((el, i) => {
    el.classList.toggle('active', i === s.gradient);
  });
  // Text color
  document.getElementById('colorWhite').classList.toggle('active', s.textColor === '#FFFFFF');
  document.getElementById('colorDark').classList.toggle('active', s.textColor === '#1E1B4B');
}

function setTextColor(color) {
  screenshots[currentIdx].textColor = color;
  syncControlsFromState();
  updatePreview();
}

function resetCurrent() {
  const s = screenshots[currentIdx];
  const preset = findPreset(s.filename) || PRESETS[0];
  s.headline = preset.headline;
  s.subtitle = preset.subtitle;
  s.gradient = preset.gradient;
  s.textColor = preset.textColor;
  s.headlineSize = preset.headlineSize;
  s.phoneY = preset.phoneY;
  loadStateToControls();
  updatePreview();
}

// ─── Image Loading ──────────────────────────────────────────
function loadImages(files) {
  const imageFiles = Array.from(files)
    .filter(f => f.type.startsWith('image/'))
    .sort((a, b) => {
      const na = extractNumber(a.name) || '0';
      const nb = extractNumber(b.name) || '0';
      return parseInt(na) - parseInt(nb);
    });

  if (imageFiles.length === 0) return;

  let loaded = 0;
  screenshots = [];

  imageFiles.forEach((file, idx) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const preset = findPreset(file.name);
        const defaults = preset || PRESETS[idx % PRESETS.length];

        screenshots[idx] = {
          filename: file.name,
          image: img,
          imageSrc: e.target.result,
          headline: defaults.headline,
          subtitle: defaults.subtitle,
          gradient: defaults.gradient,
          textColor: defaults.textColor,
          headlineSize: defaults.headlineSize,
          phoneY: defaults.phoneY,
        };

        loaded++;
        if (loaded === imageFiles.length) {
          screenshots = screenshots.filter(Boolean);
          showEditor();
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function showEditor() {
  dropZone.classList.remove('active');
  editor.classList.add('active');
  currentIdx = 0;
  buildGradientSwatches();
  buildThumbnails();
  loadStateToControls();

  document.fonts.ready.then(() => {
    updatePreview();
  });
}

// ─── Export ─────────────────────────────────────────────────
function exportCurrent() {
  saveCurrentToState();
  const s = screenshots[currentIdx];
  const offscreen = document.createElement('canvas');
  offscreen.width = CW;
  offscreen.height = CH;
  render(offscreen, s, currentIdx);

  offscreen.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `recall-appstore-${currentIdx + 1}.png`;
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/png');
}

async function exportAll() {
  saveCurrentToState();
  exportProgressEl.classList.add('active');

  for (let i = 0; i < screenshots.length; i++) {
    progressText.textContent = `Exporting ${i + 1} / ${screenshots.length}...`;
    progressFill.style.width = `${((i + 1) / screenshots.length) * 100}%`;

    const s = screenshots[i];
    const offscreen = document.createElement('canvas');
    offscreen.width = CW;
    offscreen.height = CH;
    render(offscreen, s, i);

    await new Promise(resolve => {
      offscreen.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `recall-appstore-${i + 1}.png`;
        a.click();
        URL.revokeObjectURL(url);
        resolve();
      }, 'image/png');
    });

    await sleep(400);
  }

  progressText.textContent = 'Done!';
  await sleep(800);
  exportProgressEl.classList.remove('active');
  progressFill.style.width = '0%';
}

// ─── Events ─────────────────────────────────────────────────
headlineInput.addEventListener('input', () => {
  screenshots[currentIdx].headline = headlineInput.value;
  updatePreview();
});
subtitleInput.addEventListener('input', () => {
  screenshots[currentIdx].subtitle = subtitleInput.value;
  updatePreview();
});
headlineSizeSlider.addEventListener('input', () => {
  const v = parseInt(headlineSizeSlider.value);
  headlineSizeValue.textContent = v;
  screenshots[currentIdx].headlineSize = v;
  updatePreview();
});
phoneYSlider.addEventListener('input', () => {
  const v = parseInt(phoneYSlider.value);
  phoneYValue.textContent = v;
  screenshots[currentIdx].phoneY = v;
  updatePreview();
});

// File input
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length > 0) loadImages(e.target.files);
});

// Drag & drop
dropArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropArea.classList.add('dragover');
});
dropArea.addEventListener('dragleave', () => {
  dropArea.classList.remove('dragover');
});
dropArea.addEventListener('drop', (e) => {
  e.preventDefault();
  dropArea.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) loadImages(e.dataTransfer.files);
});

// Click on drop area
dropArea.addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') {
    fileInput.click();
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (!editor.classList.contains('active')) return;
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    e.preventDefault();
    if (currentIdx > 0) selectScreen(currentIdx - 1);
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
    e.preventDefault();
    if (currentIdx < screenshots.length - 1) selectScreen(currentIdx + 1);
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'e') {
    e.preventDefault();
    exportCurrent();
  }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'E') {
    e.preventDefault();
    exportAll();
  }
});
</script>
