<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall People - App Store Screenshot Frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --bg: #F8F7F4;
    --bg-cream: #FFF8F0;
    --surface: #FFFFFF;
    --text-primary: #1A1A1A;
    --text-secondary: #57534E;
    --text-muted: #A8A29E;
    --border: #E7E5E4;
    --primary: #8B5CF6;
    --primary-hover: #7C3AED;
    --primary-light: #EDE9FE;
    --accent-warm: #E07A5F;
    --accent-warm-light: #FFEDD5;
    --voice: #10B981;
    --calendar: #F59E0B;
    --error: #EF4444;

    /* Screenshot frame backgrounds - one per screenshot for visual variety */
    --frame-bg-1: linear-gradient(170deg, #8B5CF6 0%, #6D28D9 100%);
    --frame-bg-2: linear-gradient(170deg, #10B981 0%, #059669 100%);
    --frame-bg-3: linear-gradient(170deg, #8B5CF6 0%, #A78BFA 100%);
    --frame-bg-4: linear-gradient(170deg, #F59E0B 0%, #D97706 100%);
    --frame-bg-5: linear-gradient(170deg, #6366F1 0%, #4F46E5 100%);
    --frame-bg-6: linear-gradient(170deg, #10B981 0%, #14B8A6 100%);
    --frame-bg-7: linear-gradient(170deg, #8B5CF6 0%, #7C3AED 100%);
    --frame-bg-8: linear-gradient(170deg, #F59E0B 0%, #EAB308 100%);
    --frame-bg-9: linear-gradient(170deg, #6366F1 0%, #818CF8 100%);
    --frame-bg-10: linear-gradient(170deg, #1A1A1A 0%, #374151 100%);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.5;
  }

  /* ── Toolbar ── */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(248,247,244,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .toolbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .toolbar h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .toolbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* Language Toggle */
  .lang-toggle {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .lang-btn {
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
  }
  .lang-btn.active {
    background: var(--primary);
    color: white;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: var(--primary);
    color: white;
  }
  .btn-primary:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(139,92,246,0.3);
  }
  .btn-secondary {
    background: var(--surface);
    color: var(--text-primary);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    background: #F1F0ED;
    transform: translateY(-1px);
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }

  /* ── Main Grid ── */
  .screenshots-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    padding: 32px 24px;
    max-width: 1600px;
    margin: 0 auto;
  }

  /* ── Screenshot Card (editor view) ── */
  .screenshot-card {
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .screenshot-card:hover {
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
  }

  .card-header {
    padding: 16px 16px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-number {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
  }
  .card-actions {
    display: flex;
    gap: 6px;
  }
  .card-action-btn {
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
  }
  .card-action-btn:hover {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .card-action-btn.remove-btn:hover {
    background: var(--error);
    border-color: var(--error);
  }

  /* Preview area */
  .card-preview {
    padding: 12px 16px;
  }
  .preview-frame {
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 1284 / 2778;
    position: relative;
    cursor: pointer;
  }

  /* Mini render of the actual frame inside the card */
  .mini-frame {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 6% 4% 0;
    position: relative;
    overflow: hidden;
  }

  .mini-text-area {
    text-align: center;
    flex-shrink: 0;
    width: 100%;
    padding-top: 4%;
    padding-bottom: 4%;
  }
  .mini-headline {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    color: white;
    line-height: 1.15;
    margin-bottom: 3%;
    font-size: clamp(10px, 2.2vw, 18px);
  }
  .mini-subtext {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
    line-height: 1.3;
    font-size: clamp(6px, 1.1vw, 11px);
  }

  /* Mini phone mockup */
  .mini-phone-area {
    flex: 1;
    width: 90%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 1%;
    min-height: 0;
    overflow: hidden;
  }
  .mini-phone {
    width: 100%;
    background: #1A1A1A;
    border-top-left-radius: 5%;
    border-top-right-radius: 5%;
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    padding: 1.5% 1.5% 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.15), 0 8px 32px rgba(0,0,0,0.25);
    flex-shrink: 0;
    height: 140%;
    display: flex;
    flex-direction: column;
  }
  .mini-phone-screen {
    flex: 1;
    background: #2D2D2D;
    border-top-left-radius: 5%;
    border-top-right-radius: 5%;
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    overflow: hidden;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    position: relative;
  }
  .mini-phone-screen img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Drop zone overlay */
  .drop-zone-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    transition: all 0.2s;
  }
  .drop-zone-overlay .icon {
    font-size: 24px;
    margin-bottom: 6px;
    opacity: 0.6;
  }
  .drop-zone-overlay .label {
    font-size: 10px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .preview-frame.has-image .drop-zone-overlay {
    opacity: 0;
  }
  .preview-frame.has-image:hover .drop-zone-overlay {
    opacity: 1;
    background: rgba(0,0,0,0.4);
  }
  .preview-frame.dragover .drop-zone-overlay {
    opacity: 1;
    background: rgba(139,92,246,0.3);
    border: 2px dashed rgba(255,255,255,0.7);
  }

  .card-footer {
    padding: 8px 16px 16px;
    text-align: center;
  }
  .card-footer .headline-preview {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-footer .sub-preview {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Hidden render canvas for export ── */
  .render-offscreen {
    position: fixed;
    left: -9999px;
    top: 0;
    z-index: -1;
    pointer-events: none;
  }

  /* Actual export frame (1284 x 2778) */
  .export-frame {
    width: 1284px;
    height: 2778px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    overflow: hidden;
  }

  .export-text-area {
    text-align: center;
    padding: 100px 80px 30px;
    width: 100%;
    flex-shrink: 0;
  }
  .export-headline {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 800;
    font-size: 82px;
    color: white;
    line-height: 1.1;
    margin-bottom: 20px;
    letter-spacing: -0.5px;
  }
  .export-subtext {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 36px;
    color: rgba(255,255,255,0.8);
    line-height: 1.35;
  }

  .export-phone-area {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    width: 100%;
    padding: 20px 0 0;
    min-height: 0;
    overflow: hidden;
  }
  .export-phone {
    width: 1140px;
    height: 2400px;
    background: #1A1A1A;
    border-radius: 44px 44px 0 0;
    padding: 12px 12px 0;
    box-shadow: 0 -6px 60px rgba(0,0,0,0.2), 0 20px 80px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .export-phone-screen {
    flex: 1;
    background: #F8F7F4;
    border-radius: 34px 34px 0 0;
    overflow: hidden;
    display: flex;
    position: relative;
  }
  .export-phone-screen img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Notch - hidden, we let the screenshot show its own status bar */
  .export-phone-notch {
    display: none;
  }

  /* Status indicator */
  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 50px;
    z-index: 3;
  }

  /* ── Progress overlay ── */
  .progress-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
  }
  .progress-overlay.active {
    display: flex;
  }
  .progress-box {
    background: var(--surface);
    border-radius: 20px;
    padding: 40px 48px;
    text-align: center;
    box-shadow: 0 24px 64px rgba(0,0,0,0.15);
    min-width: 320px;
  }
  .progress-box h3 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .progress-box p {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }
  .progress-bar-track {
    width: 100%;
    height: 8px;
    background: #F1F0ED;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 4px;
    transition: width 0.3s ease;
    width: 0%;
  }

  /* ── Empty state for phone screen ── */
  .empty-phone-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: rgba(255,255,255,0.2);
  }
  .empty-phone-icon svg {
    width: 28px;
    height: 28px;
    opacity: 0.4;
  }
  .empty-phone-icon span {
    font-size: 8px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .screenshots-grid {
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      padding: 16px;
    }
    .toolbar {
      padding: 12px 16px;
    }
    .toolbar h1 {
      font-size: 16px;
    }
  }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Hidden file input */
  .hidden-input {
    display: none;
  }
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <div class="toolbar-left">
    <h1>Recall People - Screenshot Frames</h1>
  </div>
  <div class="toolbar-right">
    <div class="lang-toggle">
      <button class="lang-btn active" data-lang="en" onclick="setLanguage('en')">EN</button>
      <button class="lang-btn" data-lang="fr" onclick="setLanguage('fr')">FR</button>
    </div>
    <button class="btn btn-secondary" onclick="downloadAll()" id="downloadAllBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download All
    </button>
  </div>
</div>

<!-- Screenshot Cards Grid -->
<div class="screenshots-grid" id="screenshotsGrid"></div>

<!-- Offscreen render area -->
<div class="render-offscreen" id="renderArea"></div>

<!-- Progress overlay -->
<div class="progress-overlay" id="progressOverlay">
  <div class="progress-box">
    <h3 id="progressTitle">Exporting...</h3>
    <p id="progressText">Rendering screenshot 1 of 10</p>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>
</div>

<script>
// ── Screenshot data ──
const screenshots = [
  {
    id: 1,
    en: { headline: "Remember every\nconversation", sub: "Your relationships, organized" },
    fr: { headline: "N\u2019oubliez plus\nvos rencontres", sub: "Vos relations, organis\u00e9es" },
    bg: "linear-gradient(170deg, #8B5CF6 0%, #6D28D9 100%)"
  },
  {
    id: 2,
    en: { headline: "Talk. That\u2019s it.", sub: "Voice notes that remember" },
    fr: { headline: "Parlez, c\u2019est tout.", sub: "Des notes vocales intelligentes" },
    bg: "linear-gradient(170deg, #10B981 0%, #059669 100%)"
  },
  {
    id: 3,
    en: { headline: "Everything you know.\nOne glance.", sub: "AI-powered contact profiles" },
    fr: { headline: "Tout ce que vous savez.\nEn un coup d\u2019\u0153il.", sub: "Fiches contact enrichies par l\u2019IA" },
    bg: "linear-gradient(170deg, #8B5CF6 0%, #A78BFA 100%)"
  },
  {
    id: 4,
    en: { headline: "Never miss\nwhat matters", sub: "Your personal event radar" },
    fr: { headline: "Ne ratez plus\nce qui compte", sub: "Votre radar personnel" },
    bg: "linear-gradient(170deg, #F59E0B 0%, #D97706 100%)"
  },
  {
    id: 5,
    en: { headline: "Find anyone\nwith a question", sub: "Semantic search across all contacts" },
    fr: { headline: "Trouvez n\u2019importe qui\navec une question", sub: "Recherche s\u00e9mantique dans tous vos contacts" },
    bg: "linear-gradient(170deg, #6366F1 0%, #4F46E5 100%)"
  },
  {
    id: 6,
    en: { headline: "AI extracts names,\nfacts & events", sub: "From voice to structured data" },
    fr: { headline: "L\u2019IA extrait noms,\ninfos et \u00e9v\u00e9nements", sub: "De la voix aux donn\u00e9es structur\u00e9es" },
    bg: "linear-gradient(170deg, #10B981 0%, #14B8A6 100%)"
  },
  {
    id: 7,
    en: { headline: "AI writes the\nsummary for you", sub: "Smart summaries, always up to date" },
    fr: { headline: "L\u2019IA r\u00e9dige le\nr\u00e9sum\u00e9 pour vous", sub: "R\u00e9sum\u00e9s intelligents, toujours \u00e0 jour" },
    bg: "linear-gradient(170deg, #8B5CF6 0%, #7C3AED 100%)"
  },
  {
    id: 8,
    en: { headline: "Track what\u2019s\nhappening", sub: "Hot topics keep you in the loop" },
    fr: { headline: "Suivez ce qui\nse passe", sub: "Les sujets chauds vous tiennent inform\u00e9" },
    bg: "linear-gradient(170deg, #F59E0B 0%, #EAB308 100%)"
  },
  {
    id: 9,
    en: { headline: "Works in\n5 languages", sub: "English, French, Spanish, German, Italian" },
    fr: { headline: "Fonctionne en\n5 langues", sub: "Anglais, fran\u00e7ais, espagnol, allemand, italien" },
    bg: "linear-gradient(170deg, #6366F1 0%, #818CF8 100%)"
  },
  {
    id: 10,
    en: { headline: "Your data\nstays yours", sub: "Private by default. No cloud." },
    fr: { headline: "Vos donn\u00e9es\nrestent les v\u00f4tres", sub: "Priv\u00e9 par d\u00e9faut. Pas de cloud." },
    bg: "linear-gradient(170deg, #1A1A1A 0%, #374151 100%)"
  }
];

let currentLang = 'en';
let uploadedImages = {}; // { id: dataURL }

// ── Language Toggle ──
function setLanguage(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
  renderGrid();
}

// ── Render the card grid ──
function renderGrid() {
  const grid = document.getElementById('screenshotsGrid');
  grid.innerHTML = '';

  screenshots.forEach(s => {
    const data = s[currentLang];
    const hasImage = !!uploadedImages[s.id];

    const card = document.createElement('div');
    card.className = 'screenshot-card';
    card.innerHTML = `
      <div class="card-header">
        <div class="card-number">${s.id}</div>
        <div class="card-actions">
          ${hasImage ? `<button class="card-action-btn remove-btn" onclick="removeImage(${s.id})" title="Remove image">Remove</button>` : ''}
          <button class="card-action-btn" onclick="exportOne(${s.id})" title="Export as PNG">Export</button>
        </div>
      </div>
      <div class="card-preview">
        <div class="preview-frame ${hasImage ? 'has-image' : ''}"
             id="preview-${s.id}"
             ondragover="handleDragOver(event, ${s.id})"
             ondragleave="handleDragLeave(event, ${s.id})"
             ondrop="handleDrop(event, ${s.id})"
             onclick="triggerUpload(${s.id})">
          <div class="mini-frame" style="background: ${s.bg}">
            <div class="mini-text-area">
              <div class="mini-headline">${data.headline.replace(/\n/g, '<br>')}</div>
              <div class="mini-subtext">${data.sub}</div>
            </div>
            <div class="mini-phone-area">
              <div class="mini-phone">
                <div class="mini-phone-screen" id="miniscreen-${s.id}">
                  ${hasImage
                    ? `<img src="${uploadedImages[s.id]}" alt="Screenshot ${s.id}">`
                    : `<div class="empty-phone-icon">
                         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                         <span>Drop image</span>
                       </div>`
                  }
                </div>
              </div>
            </div>
          </div>
          <div class="drop-zone-overlay">
            <div class="icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <div class="label">${hasImage ? 'Replace image' : 'Drop or click'}</div>
          </div>
        </div>
      </div>
      <div class="card-footer">
        <div class="headline-preview">${data.headline.replace(/\n/g, ' ')}</div>
        <div class="sub-preview">${data.sub}</div>
      </div>
      <input type="file" accept="image/*" class="hidden-input" id="input-${s.id}" onchange="handleFileSelect(event, ${s.id})">
    `;
    grid.appendChild(card);
  });
}

// ── File handling ──
function triggerUpload(id) {
  document.getElementById(`input-${id}`).click();
}

function handleFileSelect(e, id) {
  const file = e.target.files[0];
  if (file) loadImage(file, id);
}

function handleDragOver(e, id) {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById(`preview-${id}`).classList.add('dragover');
}

function handleDragLeave(e, id) {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById(`preview-${id}`).classList.remove('dragover');
}

function handleDrop(e, id) {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById(`preview-${id}`).classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    loadImage(file, id);
  }
}

function loadImage(file, id) {
  const reader = new FileReader();
  reader.onload = (e) => {
    uploadedImages[id] = e.target.result;
    renderGrid();
  };
  reader.readAsDataURL(file);
}

function removeImage(id) {
  delete uploadedImages[id];
  renderGrid();
}

// ── Export functions ──

function buildExportFrame(s) {
  const data = s[currentLang];
  const hasImage = !!uploadedImages[s.id];

  const frame = document.createElement('div');
  frame.className = 'export-frame';
  frame.style.background = s.bg;

  // Create a subtle decorative element at top
  frame.innerHTML = `
    <div class="export-text-area">
      <div class="export-headline">${data.headline.replace(/\n/g, '<br>')}</div>
      <div class="export-subtext">${data.sub}</div>
    </div>
    <div class="export-phone-area">
      <div class="export-phone">
        <div class="export-phone-screen">
          ${hasImage
            ? `<img src="${uploadedImages[s.id]}" alt="Screenshot ${s.id}" style="width:100%;height:100%;object-fit:cover;object-position:top;">`
            : `<div style="flex:1;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.15);font-size:32px;font-weight:700;font-family:Inter,sans-serif;">No image</div>`
          }
        </div>
      </div>
    </div>
  `;

  return frame;
}

async function exportOne(id) {
  const s = screenshots.find(x => x.id === id);
  if (!s) return;

  showProgress('Exporting...', `Rendering screenshot ${id}`, 50);

  const renderArea = document.getElementById('renderArea');
  const frame = buildExportFrame(s);
  renderArea.appendChild(frame);

  // Wait for images to load
  await waitForImages(frame);

  // Small delay for rendering
  await delay(100);

  try {
    const canvas = await html2canvas(frame, {
      width: 1284,
      height: 2778,
      scale: 1,
      useCORS: true,
      backgroundColor: null,
      logging: false,
    });

    downloadCanvas(canvas, `recall-people-screenshot-${id}-${currentLang}.png`);
    updateProgress(100);
  } catch (err) {
    console.error('Export error:', err);
    alert('Export failed. Check console for details.');
  } finally {
    renderArea.innerHTML = '';
    await delay(300);
    hideProgress();
  }
}

async function downloadAll() {
  const btn = document.getElementById('downloadAllBtn');
  btn.disabled = true;

  const total = screenshots.length;
  showProgress('Exporting All', `Rendering screenshot 1 of ${total}`, 0);

  const renderArea = document.getElementById('renderArea');

  for (let i = 0; i < total; i++) {
    const s = screenshots[i];
    updateProgressText(`Rendering screenshot ${i + 1} of ${total}`);
    updateProgress(((i) / total) * 100);

    const frame = buildExportFrame(s);
    renderArea.appendChild(frame);

    await waitForImages(frame);
    await delay(100);

    try {
      const canvas = await html2canvas(frame, {
        width: 1284,
        height: 2778,
        scale: 1,
        useCORS: true,
        backgroundColor: null,
        logging: false,
      });

      downloadCanvas(canvas, `recall-people-screenshot-${s.id}-${currentLang}.png`);
    } catch (err) {
      console.error(`Export error for screenshot ${s.id}:`, err);
    }

    renderArea.innerHTML = '';
    updateProgress(((i + 1) / total) * 100);

    // Small delay between downloads to avoid browser issues
    await delay(400);
  }

  btn.disabled = false;
  await delay(300);
  hideProgress();
}

function downloadCanvas(canvas, filename) {
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// ── Progress helpers ──
function showProgress(title, text, pct) {
  document.getElementById('progressTitle').textContent = title;
  document.getElementById('progressText').textContent = text;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressOverlay').classList.add('active');
}
function updateProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
}
function updateProgressText(text) {
  document.getElementById('progressText').textContent = text;
}
function hideProgress() {
  document.getElementById('progressOverlay').classList.remove('active');
}

// ── Utilities ──
function delay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function waitForImages(container) {
  const imgs = container.querySelectorAll('img');
  const promises = Array.from(imgs).map(img => {
    if (img.complete) return Promise.resolve();
    return new Promise((resolve) => {
      img.onload = resolve;
      img.onerror = resolve;
    });
  });
  return Promise.all(promises);
}

// ── Init ──
renderGrid();
</script>
